spring.application.name=smartnotesapp

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ===== DATABASE =====
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/notes_app}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== JWT =====
# Minimum 256-bit key for HS256
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ===== CORS =====
app.cors.allowed-origins=http://localhost:5173,http://localhost:80,http://localhost

groq.api.key=${GROQ_API_KEY}
groq.api.url=${GROQ_API_URL}

# ===== OAUTH2 =====
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
server.forward-headers-strategy=framework

app.oauth2.redirect-uri=http://localhost/oauth2/redirect

chroma.url=${CHROMA_URL:http://chromadb:8000}
chroma.collection=${CHROMA_COLLECTION:notes}